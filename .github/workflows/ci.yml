name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-audit:
    name: Lint, Syntax & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: AST & Syntax Check
        run: |
          echo "🔍 Running AST & JavaScript syntax validation..."
          npm run check:syntax

      - name: Code Quality & Lint (ESLint 9)
        run: |
          echo "🧹 Running ESLint check..."
          npm run lint

      - name: Code Formatting Check (Prettier)
        run: |
          echo "🎨 Verifying Prettier code formatting..."
          npm run format:check

      - name: Security Vulnerability Audit
        run: |
          echo "🔒 Running npm security audit..."
          npm audit --audit-level=high || echo "⚠️ Security audit warning"

  test:
    name: Automated Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint-and-audit
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    env:
      NODE_ENV: test
      USE_MOCK_REDIS: 'true'
      ADMIN_KEY: ci_test_admin_key_32_bytes_long_ok
      CRON_API_KEY: ci_test_cron_key_32_bytes_long_ok
      ADMIN_SKIP_KEY: ci_test_admin_skip_key
      UNSUBSCRIBE_SECRET: ci_test_unsubscribe_secret
      PORT: 2900
      ALLOWED_RATE_LIMITER: 1000
      LLM_PROVIDER: curated
      VAPID_PUBLIC_KEY: ci_test_vapid_public_key_mock_string
      VAPID_PRIVATE_KEY: ci_test_vapid_private_key_mock_string
      VAPID_SUBJECT: mailto:ci-test@morningroutinesender.com
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Knex Migrations Dry-Run
        run: |
          echo "🗄️ Verifying Knex migrations status..."
          npx knex migrate:status --env test || true

      - name: Run Test Suite
        run: npm test -- --ci --maxWorkers=2
