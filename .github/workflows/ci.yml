name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-audit:
    name: Syntax & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: JavaScript Syntax Validation (node --check)
        run: |
          echo "🔍 Checking JavaScript syntax across all source files..."
          ERRORS=0
          while IFS= read -r -d '' file; do
            if ! node --check "$file" 2>&1; then
              echo "❌ Syntax error in $file"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find . -type f -name "*.js" -not -path "./node_modules/*" -not -path "./coverage/*" -print0)
          
          if [ $ERRORS -ne 0 ]; then
            echo "❌ Total syntax errors detected: $ERRORS"
            exit 1
          fi
          echo "✅ All JavaScript source files passed syntax check."

      - name: Security Vulnerability Audit
        run: |
          echo "🔒 Running npm security audit..."
          npm audit --audit-level=high || echo "⚠️ Security audit warning"

  test:
    name: Automated Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint-and-audit
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    env:
      NODE_ENV: test
      USE_MOCK_REDIS: 'true'
      ADMIN_KEY: ci_test_admin_key_32_bytes_long_ok
      CRON_API_KEY: ci_test_cron_key_32_bytes_long_ok
      ADMIN_SKIP_KEY: ci_test_admin_skip_key
      UNSUBSCRIBE_SECRET: ci_test_unsubscribe_secret
      PORT: 2900
      ALLOWED_RATE_LIMITER: 1000
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Knex Migrations Dry-Run
        run: |
          echo "🗄️ Verifying Knex migrations status..."
          npx knex migrate:status --env test || true

      - name: Run Test Suite
        run: npm test -- --ci --maxWorkers=2
