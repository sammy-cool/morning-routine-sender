<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none" role="img" aria-label="Morning Routine Sender Logo">
  <defs>
    <filter id="zenGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="sunburstGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3.5" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>

    <linearGradient id="brandGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="solarGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="zenRingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="48" fill="url(#brandGradPrimary)" opacity="0.18" filter="url(#zenGlow)" />
  <circle cx="60" cy="60" r="50" stroke="url(#zenRingGrad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="60" cy="60" r="42" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />

  <g opacity="0.85">
    <line x1="60" y1="14" x2="60" y2="24" stroke="url(#solarGoldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="60" y1="96" x2="60" y2="106" stroke="url(#brandGradPrimary)" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
    <line x1="14" y1="60" x2="24" y2="60" stroke="url(#solarGoldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="96" y1="60" x2="106" y2="60" stroke="url(#solarGoldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="27.5" y1="27.5" x2="34.5" y2="34.5" stroke="url(#solarGoldGrad)" stroke-width="2" stroke-linecap="round" />
    <line x1="92.5" y1="27.5" x2="85.5" y2="34.5" stroke="url(#solarGoldGrad)" stroke-width="2" stroke-linecap="round" />
    <line x1="27.5" y1="92.5" x2="34.5" y2="85.5" stroke="url(#brandGradPrimary)" stroke-width="2" stroke-linecap="round" opacity="0.4" />
    <line x1="92.5" y1="92.5" x2="85.5" y2="85.5" stroke="url(#brandGradPrimary)" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  </g>

  <path d="M 60 26 L 86 41 L 86 71 L 60 86 L 34 71 L 34 41 Z" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" fill="rgba(15, 23, 42, 0.65)" />
  <circle cx="60" cy="58" r="18" fill="url(#solarGoldGrad)" filter="url(#sunburstGlow)" />
  <circle cx="60" cy="58" r="14" fill="#ffffff" opacity="0.3" />
  <path d="M 40 64 C 48 56, 72 56, 80 64" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <circle cx="60" cy="52" r="3.5" fill="#ffffff" />
</svg>