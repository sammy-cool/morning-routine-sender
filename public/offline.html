<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Offline Mode • Morning Routine</title>
    <meta
      name="description"
      content="You are currently offline. Please check your internet connection to regain access."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#090d16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-main: #07090e;
        --bg-card: rgba(17, 24, 39, 0.85);
        --border-subtle: rgba(255, 255, 255, 0.08);
        --primary: #6366f1;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --accent-cyan: #06b6d4;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          "Plus Jakarta Sans",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      body {
        background-color: var(--bg-main);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background-image: radial-gradient(at 50% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 60%);
      }

      .card {
        background: var(--bg-card);
        backdrop-filter: blur(20px);
        border: 1px solid var(--border-subtle);
        border-radius: 20px;
        padding: 40px 32px;
        max-width: 480px;
        width: 100%;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      }

      .icon-wrap {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(99, 102, 241, 0.15);
        border: 1px solid rgba(99, 102, 241, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin-bottom: 8px;
      }

      h1 {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      p {
        font-size: 14px;
        color: var(--text-muted);
        line-height: 1.6;
      }

      .btn {
        background: linear-gradient(135deg, var(--primary), #4f46e5);
        color: #fff;
        padding: 11px 22px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        margin-top: 8px;
        transition: transform 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .notice {
        font-size: 12px;
        color: #818cf8;
        background: rgba(99, 102, 241, 0.1);
        padding: 8px 14px;
        border-radius: 20px;
        border: 1px solid rgba(99, 102, 241, 0.2);
        margin-top: 6px;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <div class="icon-wrap" aria-hidden="true">📡</div>
      <div
        role="status"
        aria-live="polite"
        style="display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%"
      >
        <h1>Connection Offline</h1>
        <p>
          Your internet connection seems to be unavailable. Please check your network connection.
        </p>
        <div class="notice">The page will automatically reconnect once internet is restored.</div>
      </div>
      <div style="display: flex; gap: 12px; width: 100%; margin-top: 8px">
        <button class="btn" style="flex: 1" onclick="window.location.reload()">
          Retry Connection
        </button>
        <a
          href="/"
          class="btn"
          style="
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
          "
          >Home</a
        >
      </div>
    </main>

    <script>
      window.addEventListener("online", () => {
        window.location.replace("/");
      });
    </script>
  </body>
</html>
