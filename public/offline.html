<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, safe-area-inset"
    />

    <title>Offline Mode • Morning Routine Sender</title>
    <meta
      name="description"
      content="You are currently offline. Your morning routine and habit check-ins are queued and will sync automatically upon reconnection."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#050608" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Google Fonts & FontAwesome & Preserved Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/loader.css" />

    <style>
      :root {
        --bg-main: #050608;
        --bg-card: rgba(12, 17, 29, 0.85);
        --border-subtle: rgba(255, 255, 255, 0.06);
        --primary: #7c3aed;
        --primary-glow: rgba(124, 58, 237, 0.4);
        --accent-cyan: #22d3ee;
        --accent-emerald: #34d399;
        --accent-amber: #fbbf24;
        --accent-rose: #fb7185;
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          "Plus Jakarta Sans",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      body {
        background-color: var(--bg-main);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top, 24px) env(safe-area-inset-right, 16px)
          env(safe-area-inset-bottom, 24px) env(safe-area-inset-left, 16px);
        /* Subtle animated mesh gradient */
        background-image:
          radial-gradient(circle at 15% 50%, rgba(124, 58, 237, 0.12), transparent 40%),
          radial-gradient(circle at 85% 30%, rgba(34, 211, 238, 0.08), transparent 45%),
          radial-gradient(circle at 50% 90%, rgba(52, 211, 153, 0.05), transparent 50%);
        background-size: 200% 200%;
        animation: gradientShift 15s ease infinite;
        background-attachment: fixed;
      }

      @keyframes gradientShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      @keyframes slideUpFade {
        from {
          opacity: 0;
          transform: translateY(40px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .offline-card {
        background: var(--bg-card);
        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);
        border: 1px solid var(--border-subtle);
        border-radius: 24px;
        padding: 48px 40px;
        max-width: 480px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
        box-shadow:
          0 32px 64px -16px rgba(0, 0, 0, 0.8),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        position: relative;
        overflow: hidden;
      }

      .offline-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--primary),
          var(--accent-cyan),
          transparent
        );
        opacity: 0.8;
      }

      .brand-logo {
        height: 32px;
        width: auto;
        margin-bottom: -12px;
        opacity: 0.9;
        filter: drop-shadow(0 4px 12px rgba(255, 255, 255, 0.1));
      }

      .status-radar {
        position: relative;
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .radar-wave {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 2px solid var(--primary);
        opacity: 0;
        animation: radarPulse 3s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .radar-wave:nth-child(2) {
        animation-delay: 1s;
      }
      .radar-wave:nth-child(3) {
        animation-delay: 2s;
      }

      @keyframes radarPulse {
        0% {
          transform: scale(0.5);
          opacity: 0.8;
        }
        100% {
          transform: scale(2);
          opacity: 0;
        }
      }

      .icon-wrap {
        width: 72px;
        height: 72px;
        border-radius: 24px;
        background: linear-gradient(135deg, rgba(124, 58, 237, 0.2), rgba(34, 211, 238, 0.15));
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        color: var(--primary);
        position: relative;
        z-index: 2;
        box-shadow:
          0 12px 32px var(--primary-glow),
          inset 0 2px 4px rgba(255, 255, 255, 0.1);
      }

      .text-content {
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      h1 {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--text-main);
        background: linear-gradient(to right, #fff, #cbd5e1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p.description {
        font-size: 15px;
        color: var(--text-muted);
        line-height: 1.6;
        font-weight: 400;
      }

      /* Bento Style Queue Indicator Banner */
      .queue-badge-card {
        width: 100%;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border-subtle);
        border-radius: 20px;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        text-align: left;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .queue-badge-card:hover {
        background: rgba(255, 255, 255, 0.04);
        border-color: rgba(255, 255, 255, 0.1);
      }

      .queue-info {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .queue-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: rgba(251, 191, 36, 0.1);
        border: 1px solid rgba(251, 191, 36, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent-amber);
        font-size: 18px;
        transition: transform 0.3s ease;
      }

      .queue-badge-card:hover .queue-icon {
        transform: scale(1.05);
      }

      .queue-text-block {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .queue-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--text-main);
        letter-spacing: -0.01em;
      }

      .queue-desc {
        font-size: 13px;
        color: var(--text-muted);
      }

      .queue-pill {
        padding: 6px 12px;
        border-radius: 99px;
        font-size: 14px;
        font-weight: 700;
        font-family: "JetBrains Mono", monospace;
        background: rgba(251, 191, 36, 0.15);
        color: var(--accent-amber);
        border: 1px solid rgba(251, 191, 36, 0.3);
        box-shadow: 0 4px 12px rgba(251, 191, 36, 0.1);
        transition: all 0.3s ease;
      }

      /* Auto-Retry Countdown Meter */
      .retry-meter {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: rgba(0, 0, 0, 0.2);
        padding: 16px 20px;
        border-radius: 20px;
        border: 1px solid var(--border-subtle);
      }

      .meter-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-muted);
      }

      .countdown-val {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        color: var(--accent-cyan);
        font-size: 14px;
      }

      .progress-bar-bg {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 99px;
        overflow: hidden;
      }

      .progress-bar-fill {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, var(--primary), var(--accent-cyan));
        border-radius: 99px;
        transition: width 1s linear;
        box-shadow: 0 0 10px rgba(34, 211, 238, 0.4);
      }

      /* Actions */
      .action-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        width: 100%;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 14px 24px;
        border-radius: 16px;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        border: 1px solid transparent;
        outline: none;
      }

      .btn:focus-visible {
        box-shadow:
          0 0 0 2px var(--bg-main),
          0 0 0 4px var(--primary);
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--primary), #5b21b6);
        color: #ffffff;
        box-shadow:
          0 8px 24px var(--primary-glow),
          inset 0 1px 1px rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow:
          0 12px 32px rgba(124, 58, 237, 0.6),
          inset 0 1px 1px rgba(255, 255, 255, 0.3);
      }

      .btn-primary:active {
        transform: translateY(0);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.03);
        color: var(--text-main);
        border: 1px solid var(--border-subtle);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.15);
        transform: translateY(-2px);
      }

      .btn-secondary:active {
        transform: translateY(0);
      }

      .footer-brand {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-muted);
        opacity: 0.6;
        margin-top: 8px;
      }

      /* Mobile First Responsive tweaks */
      @media (max-width: 480px) {
        .offline-card {
          padding: 32px 24px;
          gap: 28px;
        }
        .action-row {
          grid-template-columns: 1fr;
          gap: 12px;
        }
        .icon-wrap {
          width: 64px;
          height: 64px;
          font-size: 24px;
        }
        h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>

  <body>
    <main class="offline-card" role="main">
      <img
        src="/assets/logo.svg"
        alt="Morning Routine Sender Logo"
        class="brand-logo"
        onerror="this.style.display = 'none'"
      />

      <div class="status-radar" aria-hidden="true">
        <div class="radar-wave"></div>
        <div class="radar-wave"></div>
        <div class="radar-wave"></div>
        <div class="icon-wrap">
          <i class="fas fa-wifi-slash"></i>
        </div>
      </div>

      <div class="text-content" role="status" aria-live="polite">
        <h1>Connection Offline</h1>
        <p class="description">
          You are currently offline. Your active routine state is preserved locally, and pending
          actions will sync instantly once reconnected.
        </p>
      </div>

      <!-- Offline Check-in Queue Status Indicator -->
      <div class="queue-badge-card" id="offlineQueueBadge">
        <div class="queue-info">
          <div class="queue-icon">
            <i class="fas fa-bolt"></i>
          </div>
          <div class="queue-text-block">
            <div class="queue-title" id="queueStatusTitle">Offline Habit Queue</div>
            <div class="queue-desc" id="queueStatusDesc">Checking pending check-ins…</div>
          </div>
        </div>
        <span class="queue-pill" id="queueCountPill">0</span>
      </div>

      <!-- Auto-Retry Progress Meter -->
      <div class="retry-meter">
        <div class="meter-header">
          <span>Auto-reconnecting in</span>
          <span class="countdown-val" id="countdownVal">15s</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBarFill" style="width: 100%"></div>
        </div>
      </div>

      <!-- Actions -->
      <div class="action-row">
        <button type="button" class="btn btn-primary" onclick="retryConnectionNow()">
          <i class="fas fa-rotate-right" id="retrySpinner"></i> Retry Now
        </button>
        <a href="/" class="btn btn-secondary"> <i class="fas fa-home"></i> Home </a>
      </div>

      <footer class="footer-brand">Morning Routine Sender • Unshakable Morning Discipline</footer>
    </main>

    <script>
      const COUNTDOWN_TOTAL_SECONDS = 15;
      let countdownLeft = COUNTDOWN_TOTAL_SECONDS;
      let countdownTimer = null;

      async function inspectOfflineQueue() {
        let count = 0;
        try {
          if (typeof indexedDB !== "undefined") {
            const req = indexedDB.open("mrn-offline-sync-db", 1);
            req.onsuccess = (e) => {
              try {
                const db = e.target.result;
                if (db.objectStoreNames.contains("checkin_queue")) {
                  const tx = db.transaction("checkin_queue", "readonly");
                  const store = tx.objectStore("checkin_queue");
                  const countReq = store.count();
                  countReq.onsuccess = () => {
                    count = countReq.result || 0;
                    updateQueueUI(count);
                  };
                } else {
                  checkLocalStorageBackup();
                }
              } catch (_) {
                checkLocalStorageBackup();
              }
            };
            req.onerror = () => checkLocalStorageBackup();
          } else {
            checkLocalStorageBackup();
          }
        } catch (_) {
          checkLocalStorageBackup();
        }

        function checkLocalStorageBackup() {
          try {
            const items = JSON.parse(localStorage.getItem("mrn_offline_checkins_backup") || "[]");
            count = Array.isArray(items) ? items.length : 0;
          } catch (_) {
            count = 0;
          }
          updateQueueUI(count);
        }
      }

      function updateQueueUI(count) {
        const titleEl = document.getElementById("queueStatusTitle");
        const descEl = document.getElementById("queueStatusDesc");
        const pillEl = document.getElementById("queueCountPill");

        if (!titleEl || !descEl || !pillEl) return;

        pillEl.textContent = count;
        if (count > 0) {
          titleEl.textContent = "⚡ Habit Check-ins Queued";
          descEl.textContent = `${count} check-in${count > 1 ? "s" : ""} pending automatic sync`;
          pillEl.style.background = "rgba(245, 158, 11, 0.25)";
          pillEl.style.color = "#fbbf24";
          pillEl.style.borderColor = "rgba(245, 158, 11, 0.4)";
        } else {
          titleEl.textContent = "✅ Habit Queue Synced";
          descEl.textContent = "No pending offline actions in queue";
          pillEl.style.background = "rgba(16, 185, 129, 0.2)";
          pillEl.style.color = "#34d399";
          pillEl.style.borderColor = "rgba(16, 185, 129, 0.3)";
        }
      }

      function startCountdown() {
        const valEl = document.getElementById("countdownVal");
        const fillEl = document.getElementById("progressBarFill");

        countdownTimer = setInterval(() => {
          countdownLeft--;
          if (valEl) valEl.textContent = `${countdownLeft}s`;
          if (fillEl) {
            const pct = Math.max(0, (countdownLeft / COUNTDOWN_TOTAL_SECONDS) * 100);
            fillEl.style.width = `${pct}%`;
          }

          if (countdownLeft <= 0) {
            clearInterval(countdownTimer);
            retryConnectionNow();
          }
        }, 1000);
      }

      function retryConnectionNow() {
        const spinner = document.getElementById("retrySpinner");
        if (spinner) spinner.classList.add("fa-spin");

        fetch("/health", { method: "GET", cache: "no-store" })
          .then((res) => {
            if (res.ok) {
              window.location.replace("/");
            } else {
              resetCountdown();
            }
          })
          .catch(() => {
            resetCountdown();
          });
      }

      function resetCountdown() {
        const spinner = document.getElementById("retrySpinner");
        if (spinner) spinner.classList.remove("fa-spin");
        countdownLeft = COUNTDOWN_TOTAL_SECONDS;
        if (countdownTimer) clearInterval(countdownTimer);
        startCountdown();
      }

      window.addEventListener("online", () => {
        window.location.replace("/");
      });

      document.addEventListener("DOMContentLoaded", () => {
        inspectOfflineQueue();
        startCountdown();
      });
    </script>
  </body>
</html>
