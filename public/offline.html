<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Offline Mode | Connection Unavailable</title>
    <meta
      name="description"
      content="You are currently offline. Please check your internet connection to regain full access, including admin features."
    />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Styling -->
    <style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #38bdf8;
      }

      * {
        box-sizing: border-box;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #1e293b, var(--bg));
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text);
      }

      main {
        background: linear-gradient(145deg, #020617, var(--card));
        padding: 2.5rem 3rem;
        border-radius: 16px;
        max-width: 480px;
        width: 90%;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }

      .icon {
        font-size: 3.5rem;
        margin-bottom: 1rem;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 0.75rem;
      }

      p {
        font-size: 1rem;
        color: var(--muted);
        margin-bottom: 0.75rem;
        line-height: 1.6;
      }

      .notice {
        margin-top: 1.25rem;
        padding: 0.75rem 1rem;
        background: rgba(56, 189, 248, 0.1);
        border-left: 4px solid var(--accent);
        border-radius: 6px;
        color: #bae6fd;
        font-size: 0.95rem;
      }

      footer {
        margin-top: 1.5rem;
        font-size: 0.8rem;
        color: #6b7280;
      }
    </style>
  </head>

  <body>
    <main role="alert" aria-live="polite">
      <div class="icon" aria-hidden="true">📡</div>

      <h1>You’re Offline</h1>

      <p>
        It looks like your internet connection is currently unavailable. Please
        check your network and try again.
      </p>

      <div class="notice">Admin features are disabled while offline.</div>

      <footer>
        This page will automatically work once your connection is restored.
      </footer>
    </main>
  </body>
</html>
